services:
  # Single Web Service running Django + Celery inside one Free instance
  - type: web
    name: email-automation
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "0"
      - key: CLOUD_PLATFORM
        value: "RENDER"
      - key: DOMAIN
        generateValue: true
      - key: PORD_SECRET_KEY
        generateValue: true
      - key: PROD_FIELD_ENCRYPTION_KEY
        value: "W8kBH68PL7KbS3KurgsOpDxbcmShhA4FqYV-jizbdhQ="
      - key: POSTGRES_URL
        sync: false # Set via free Supabase / Neon / Render Postgres
      - key: REDIS_PROD_HOST
        sync: false # Set via free Upstash Redis
