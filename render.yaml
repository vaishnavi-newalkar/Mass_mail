services:
  # Single Web Service running Django + Celery inside one Free instance
  - type: web
    name: email-automation
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "0"
      - key: CLOUD_PLATFORM
        value: "RENDER"
      - key: ALLOWED_PROD_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DOMAIN
        value: "https://email-automation-zwnr.onrender.com"
      - key: PORD_SECRET_KEY
        generateValue: true
      - key: PROD_FIELD_ENCRYPTION_KEY
        value: "W8kBH68PL7KbS3KurgsOpDxbcmShhA4FqYV-jizbdhQ="
      - key: POSTGRES_URL
        sync: false
      - key: REDIS_PROD_HOST
        sync: false
